name: Build → Docker Hub → Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/hebrew-text-renderer
  CONTAINER: hebrew-renderer

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Fonts/backgrounds are large and gitignored.
      # They must be pre-built into an image tagged :base and pushed to Docker Hub.
      # This job just pulls :latest (already containing fonts) and redeploys.
      - name: Build and push (code only layer on top of base)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:latest
            docker stop ${{ env.CONTAINER }} 2>/dev/null || true
            docker rm   ${{ env.CONTAINER }} 2>/dev/null || true
            docker run -d \
              --name ${{ env.CONTAINER }} \
              --restart unless-stopped \
              -p 80:8000 \
              ${{ env.IMAGE }}:latest
            docker image prune -f
