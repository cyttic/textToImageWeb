name: Build → Docker Hub → Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/hebrew-text-renderer
  CONTAINER: hebrew-renderer

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Docker build cache (speeds up repeated builds) ─────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to Docker Hub ────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ── 4. Build & push image ─────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Deploy to Azure VM ─────────────────────────────────────────────
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ env.IMAGE }}:latest

            # Stop and remove old container (ignore errors if not running)
            docker stop ${{ env.CONTAINER }} 2>/dev/null || true
            docker rm   ${{ env.CONTAINER }} 2>/dev/null || true

            # Run new container
            # Fonts and backgrounds are mounted from /data on the VM
            docker run -d \
              --name ${{ env.CONTAINER }} \
              --restart unless-stopped \
              -p 80:8000 \
              -v /data/fonts:/app/fonts \
              -v /data/backgrounds:/app/backgrounds \
              -e FONT_DIRS=/app/fonts \
              -e BG_DIR=/app/backgrounds \
              ${{ env.IMAGE }}:latest

            # Remove unused images to save disk space
            docker image prune -f
